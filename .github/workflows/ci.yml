name: CI

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Intel (x86_64) Native Build & Test"
            os: macos-13
            target_arch: x86_64
            is_cross: false
          - name: "Apple Silicon (arm64) Native Build & Test"
            os: macos-15
            target_arch: arm64
            is_cross: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Environment & Architecture
        run: |
          echo "Host Architecture: $(uname -m)"
          echo "OS Version: $(sw_vers -productVersion)"
          swift --version

      - name: Build Native Release Binary
        run: swift build -c release

      - name: Verify Binary Architecture
        run: |
          BIN_PATH=".build/release/TouchBridgeProbe"
          file "$BIN_PATH"
          lipo -info "$BIN_PATH"
          if [ "${{ matrix.target_arch }}" = "x86_64" ]; then
            file "$BIN_PATH" | grep -q "x86_64" || { echo "Expected x86_64 binary"; exit 1; }
          else
            file "$BIN_PATH" | grep -q "arm64" || { echo "Expected arm64 binary"; exit 1; }
          fi

      - name: Run Headless Architecture Tests (86 Tests)
        run: |
          echo "Executing deterministic architecture test suite..."
          swift run TouchBridgeProbe --test-architecture

      - name: Cross-compile x86_64 on Apple Silicon Runner
        if: matrix.os == 'macos-15'
        run: |
          echo "Verifying cross-compilation targeting Intel x86_64 from Apple Silicon runner..."
          swift build -c release --arch x86_64
          CROSS_BIN=".build/x86_64-apple-macosx/release/TouchBridgeProbe"
          if [ -f "$CROSS_BIN" ]; then
            file "$CROSS_BIN"
            file "$CROSS_BIN" | grep -q "x86_64" || { echo "Expected cross-compiled x86_64 binary"; exit 1; }
            echo "Cross-compiled x86_64 binary verified successfully (Note: Execution tests require Intel host/virtualization)."
          fi

      - name: Package & Validate Real Application Bundle (.app)
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          ARCH="${{ matrix.target_arch }}"
          BUNDLE_DIR="build/release/TouchBridge.app"
          rm -rf "build/release"
          mkdir -p "$BUNDLE_DIR/Contents/MacOS" "$BUNDLE_DIR/Contents/Resources"
          
          # Copy release executable
          cp .build/release/TouchBridgeProbe "$BUNDLE_DIR/Contents/MacOS/TouchBridge"
          chmod +x "$BUNDLE_DIR/Contents/MacOS/TouchBridge"
          
          # Generate validated Info.plist
          cat <<EOF > "$BUNDLE_DIR/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
              <key>CFBundleExecutable</key><string>TouchBridge</string>
              <key>CFBundleIdentifier</key><string>com.antigravity.touchbridge.dev</string>
              <key>CFBundleName</key><string>TouchBridge</string>
              <key>CFBundleDisplayName</key><string>TouchBridge</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>${VERSION}</string>
              <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
              <key>TouchBridgeCommit</key><string>${GITHUB_SHA}</string>
              <key>LSMinimumSystemVersion</key><string>12.0</string>
              <key>LSUIElement</key><true/>
              <key>NSPrincipalClass</key><string>NSApplication</string>
              <key>NSHighResolutionCapable</key><true/>
              <key>NSAccessibilityUsageDescription</key><string>TouchBridge requires Accessibility permissions to route touch interactions and perform native scrolling.</string>
          </dict></plist>
          EOF
          
          plutil -lint "$BUNDLE_DIR/Contents/Info.plist"
          
          # Verify executable inside bundle
          file "$BUNDLE_DIR/Contents/MacOS/TouchBridge"
          
          # Package bundle into zip archive and verify integrity
          cd build/release
          ZIP_NAME="TouchBridge-v${VERSION}-macOS-${ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent "TouchBridge.app" "$ZIP_NAME"
          unzip -t "$ZIP_NAME"
          shasum -a 256 "$ZIP_NAME" > SHA256SUMS
          cat SHA256SUMS
